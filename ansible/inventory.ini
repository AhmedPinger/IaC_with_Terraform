# Template inventory. The Jenkins pipeline in jenkins_config/main.groovy
# overwrites this file with the real host, using the public IP from the
# Terraform output and the key path in the ANSIBLE_SSH_KEY environment variable.
#
# To run the playbook by hand, replace the placeholders below.
# The group name must stay web_server, because ansible/web_server.yml targets it.

[web_server]
web_server_1 ansible_ssh_host=REPLACE_WITH_PUBLIC_IP ansible_ssh_user=admin ansible_ssh_private_key_file=REPLACE_WITH_PATH_TO_KEY.pem
